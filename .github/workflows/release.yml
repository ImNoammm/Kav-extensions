# Keeps this source's index from expiring: every Monday it signs the index again and publishes it. Kav refuses an
# index past its expiry, and each signing here gives it 30 more days.
#
# Releases are not made here. The extensions are Kotlin and JavaScript; the Kotlin ones need a JDK, the Android SDK and
# the Kotlin compiler, and the publisher key never leaves the computer that packs them. A release is packed, added and
# committed by hand (README, "Releasing"); this workflow only signs the index.
#
# It needs one repository secret (Settings, Secrets and variables, Actions): KAV_INDEX_KEY, the whole text of the
# index key (examples-index.pem). The root and publisher key (examples-source.pem) never goes here.
#
# It checks out the Kav extension kit from github.com/ImNoammm/kav-extension-kit beside this repository and runs its
# kavx (the kit has no dependencies). Until the kit is published there, this workflow fails and the index has to be
# signed by hand (README, "Keeping the index fresh").
name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kav-extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kav-extensions

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ImNoammm/kav-extension-kit
          path: kav-extension-kit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sign the index
        env:
          KAV_INDEX_KEY: ${{ secrets.KAV_INDEX_KEY }}
        run: node ../kav-extension-kit/bin/kavx.js repo sign . --index-key env:KAV_INDEX_KEY

      - name: Check the source the way Kav will
        run: node ../kav-extension-kit/bin/kavx.js repo verify .

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json releases.json
          git commit -m "Sign the index again"
          git push

      # Fails the run, so GitHub tells you, when the root expires within 45 days. Only the root key renews it:
      # "kavx repo root . --key examples-source.pem" on your own computer, then commit kav-repository.json.
      - name: Check when the root expires
        run: node ../kav-extension-kit/bin/kavx.js repo status . --warn-days 45
